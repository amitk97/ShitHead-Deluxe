name: One-time Play Matrix render refactor

on:
  push:
    branches:
      - refactor-play-matrix-render

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-play-matrix-render
          fetch-depth: 0
      - name: Locate renderMatrixReference boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_LINES_BEFORE=$(wc -l < index.html)"
          start=$(grep -n "^    function renderMatrixReference()" index.html | head -1 | cut -d: -f1)
          echo "START=$start"
          sed -n "${start},$((start+140))p" index.html
