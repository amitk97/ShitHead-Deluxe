name: Refactor avatar art

on:
  push:
    branches:
      - refactor-avatar-art

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-avatar-art
          fetch-depth: 0
      - name: Extract AVATAR_ART
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          before = len(text.splitlines())

          start_marker = '    const AVATAR_ART = {'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('AVATAR_ART start marker not found')

          brace = text.find('{', start)
          depth = 0
          quote = None
          escape = False
          i = brace
          while i < len(text):
              ch = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
              else:
                  if ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in ' \t':
                              end += 1
                          if end < len(text) and text[end] == ';':
                              end += 1
                          if end < len(text) and text[end] == '\n':
                              end += 1
                          break
              i += 1
          else:
              raise SystemExit('Could not find end of AVATAR_ART object')

          block = text[start:end]
          if 'const AVATAR_ART = {' not in block:
              raise SystemExit('Unexpected AVATAR_ART block')

          lines = block.splitlines()
          extracted = '\n'.join(line[4:] if line.startswith('    ') else line for line in lines).rstrip() + '\n'
          Path('js/avatar-art.js').write_text('// Static inline SVG/avatar artwork definitions.\n' + extracted, encoding='utf-8')

          text = text[:start] + text[end:]
          loader = '  <script src="js/avatar-tones.js"></script>\n'
          insertion = loader + '  <script src="js/avatar-art.js"></script>\n'
          if loader not in text:
              raise SystemExit('avatar-tones loader insertion point not found')
          text = text.replace(loader, insertion, 1)
          p.write_text(text, encoding='utf-8')

          after = len(text.splitlines())
          print(f'INDEX_LINES_BEFORE={before}')
          print(f'INDEX_LINES_AFTER={after}')
          print(f'INDEX_LINES_REMOVED={before-after}')
          PY
      - name: Verify extraction
        shell: bash
        run: |
          node --check js/avatar-art.js
          grep -q "const AVATAR_ART = {" js/avatar-art.js
          grep -q 'src="js/avatar-art.js"' index.html
          ! grep -q "const AVATAR_ART = {" index.html
          node tools/house-rules-integration-test.js
      - name: Commit refactor and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/refactor-avatar-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/avatar-art.js .github/workflows/refactor-avatar-art.yml
          git commit -m "Refactor avatar art out of index"
          git push origin HEAD:refactor-avatar-art
