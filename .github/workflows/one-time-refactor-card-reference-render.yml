name: One-time Card Reference render refactor

on:
  push:
    branches:
      - refactor-card-reference-render

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-card-reference-render
          fetch-depth: 0
      - name: Extract renderCardReference
        shell: bash
        run: |
          set -euo pipefail
          before=$(wc -l < index.html)
          echo "INDEX_LINES_BEFORE=$before"
          python3 <<'PY'
          from pathlib import Path

          p=Path('index.html')
          html=p.read_text()
          marker='    function renderCardReference() {'
          start=html.index(marker)
          i=start
          depth=0
          opened=False
          in_s=in_d=in_t=False
          escaped=False
          end=None
          while i < len(html):
              ch=html[i]
              if escaped:
                  escaped=False
              elif ch=='\\':
                  escaped=True
              elif not in_d and not in_t and ch=="'":
                  in_s=not in_s
              elif not in_s and not in_t and ch=='"':
                  in_d=not in_d
              elif not in_s and not in_d and ch=='`':
                  in_t=not in_t
              elif not in_s and not in_d and not in_t:
                  if ch=='{':
                      depth+=1; opened=True
                  elif ch=='}':
                      depth-=1
                      if opened and depth==0:
                          end=i+1
                          break
              i+=1
          if end is None:
              raise RuntimeError('Could not find end of renderCardReference')
          while end < len(html) and html[end] in '\r\n':
              end+=1
          block=html[start:end]
          extracted='\n'.join(line[4:] if line.startswith('    ') else line for line in block.splitlines()).rstrip()+'\n'
          out=Path('js/card-reference-ui.js')
          out.write_text(out.read_text().rstrip()+'\n\n'+extracted)
          p.write_text(html[:start]+html[end:])
          PY
          node --check js/card-reference-ui.js
          node tools/house-rules-integration-test.js
          after=$(wc -l < index.html)
          echo "INDEX_LINES_AFTER=$after"
          echo "INDEX_LINES_REMOVED=$((before-after))"
          rm .github/workflows/one-time-refactor-card-reference-render.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/card-reference-ui.js .github/workflows/one-time-refactor-card-reference-render.yml
          git commit -m "Extract Card Powers reference renderer"
          git push origin HEAD:refactor-card-reference-render
