name: One-time Play Matrix panel refactor

on:
  push:
    branches:
      - refactor-play-matrix-panel

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-play-matrix-panel
          fetch-depth: 0
      - name: Extract Play Matrix panel controls
        shell: bash
        run: |
          set -euo pipefail
          before=$(wc -l < index.html)
          echo "INDEX_LINES_BEFORE=$before"
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text()
          pieces = []

          def take(start_marker, end_marker):
              global html
              start = html.index(start_marker)
              end = html.index(end_marker, start)
              block = html[start:end]
              pieces.append('\n'.join(line[4:] if line.startswith('    ') else line for line in block.splitlines()).rstrip())
              html = html[:start] + html[end:]

          # Keep matrixRefOpen in index.html; move Matrix-specific zoom state/helpers.
          take(
              '    const MATRIX_REF_ZOOM_MIN = 0.6;\n',
              '    // Builds the ✓/✗ grid. Reuses getReferenceAvailableRanks (already\n'
          )
          # Move Matrix positioning, persistence, drag and resize gestures; keep toggleMatrixReference in index.html.
          take(
              '    // Default position: deliberately anchored to where the hand-count badge\n',
              '    function toggleMatrixReference(forceClose) {\n'
          )

          Path('js/play-matrix-panel.js').write_text(
              '// Play Matrix floating panel positioning, persistence, drag and resize behaviour.\n'
              '// Shared floating-panel clamping and panel open/close state remain in index.html.\n\n'
              + '\n\n'.join(pieces) + '\n'
          )

          anchor = '  <script src="js/play-matrix-ui.js"></script>\n'
          if anchor not in html:
              raise RuntimeError('play-matrix-ui script anchor not found')
          html = html.replace(anchor, anchor + '  <script src="js/play-matrix-panel.js"></script>\n', 1)
          p.write_text(html)
          PY
          node --check js/play-matrix-panel.js
          node tools/house-rules-integration-test.js
          after=$(wc -l < index.html)
          echo "INDEX_LINES_AFTER=$after"
          echo "INDEX_LINES_REMOVED=$((before-after))"
          rm .github/workflows/one-time-refactor-play-matrix-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/play-matrix-panel.js .github/workflows/one-time-refactor-play-matrix-panel.yml
          git commit -m "Extract Play Matrix panel controls"
          git push origin HEAD:refactor-play-matrix-panel
