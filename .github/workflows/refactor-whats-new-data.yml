name: Refactor What's New data

on:
  push:
    branches:
      - refactor-whats-new-data

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-whats-new-data
          fetch-depth: 0
      - name: Extract What's New data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          before = len(text.splitlines())

          start_marker = "    const WN_KEY = 'key';\n"
          end_marker = "    const SEEN_VERSION_KEY = 'shithead_seen_version';"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('WN_KEY start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('SEEN_VERSION_KEY end marker not found')

          block = text[start:end]
          if "const WHATS_NEW = {" not in block or "v312:" not in block:
              raise SystemExit('Unexpected WHATS_NEW block')

          data = """// What's New static release-note data.\n// Extracted from index.html without changing note content or behaviour.\n(() => {\n""" + block + "  window.ShWhatsNewData = { WN_KEY, WHATS_NEW };\n})();\n"
          Path('js/whats-new-data.js').write_text(data, encoding='utf-8')

          replacement = "    const { WN_KEY, WHATS_NEW } = window.ShWhatsNewData;\n"
          text = text[:start] + replacement + text[end:]

          loader = '  <script src="js/card-hold.js"></script>\n'
          loader_with_data = loader + '  <script src="js/whats-new-data.js"></script>\n'
          if loader_with_data not in text:
              if loader not in text:
                  raise SystemExit('Card Hold loader insertion point not found')
              text = text.replace(loader, loader_with_data, 1)

          index.write_text(text, encoding='utf-8')
          after = len(text.splitlines())
          print(f'INDEX_LINES_BEFORE={before}')
          print(f'INDEX_LINES_AFTER={after}')
          print(f'INDEX_LINES_REMOVED={before-after}')
          PY
      - name: Verify extraction
        shell: bash
        run: |
          node --check js/whats-new-data.js
          grep -q "window.ShWhatsNewData" js/whats-new-data.js
          grep -q "v312:" js/whats-new-data.js
          grep -q 'src="js/whats-new-data.js"' index.html
          ! grep -q "const WHATS_NEW = {" index.html
          node tools/house-rules-integration-test.js
      - name: Commit refactor and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/refactor-whats-new-data.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/whats-new-data.js .github/workflows/refactor-whats-new-data.yml
          git commit -m "Refactor What's New data out of index"
          git push origin HEAD:refactor-whats-new-data
