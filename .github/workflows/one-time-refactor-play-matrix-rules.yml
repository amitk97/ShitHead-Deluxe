name: One-time Play Matrix rules refactor

on:
  push:
    branches:
      - refactor-play-matrix-rules

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-play-matrix-rules
          fetch-depth: 0
      - name: Extract houseMatrixLegal helper
        shell: bash
        run: |
          set -euo pipefail
          before=$(wc -l < index.html)
          echo "INDEX_LINES_BEFORE=$before"
          python3 <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text()
          marker = '    function houseMatrixLegal(rowRank, colRank) {'
          start = html.index(marker)

          i = start
          brace = 0
          seen_open = False
          end = None
          while i < len(html):
              ch = html[i]
              if ch == '{':
                  brace += 1
                  seen_open = True
              elif ch == '}':
                  brace -= 1
                  if seen_open and brace == 0:
                      end = i + 1
                      break
              i += 1
          if end is None:
              raise RuntimeError('Could not find end of houseMatrixLegal')

          while end < len(html) and html[end] in '\r\n':
              end += 1
          block = html[start:end]
          extracted = '\n'.join(line[4:] if line.startswith('    ') else line for line in block.splitlines()).rstrip() + '\n'
          Path('js/play-matrix-rules.js').write_text('// Dynamic House Rules legality helper for the Play Matrix.\n// Rendering and standard matrix data remain separate.\n' + extracted)

          html = html[:start] + html[end:]
          anchor = '  <script src="js/play-matrix-data.js"></script>\n'
          insertion = anchor + '  <script src="js/play-matrix-rules.js"></script>\n'
          if 'js/play-matrix-rules.js' not in html:
              html = html.replace(anchor, insertion, 1)
          index_path.write_text(html)

          test_path = Path('tools/house-rules-integration-test.js')
          test = test_path.read_text()
          needle = "const html=fs.readFileSync(path.join(__dirname,'../index.html'),'utf8');\n"
          addition = needle + "const playMatrixRules=fs.readFileSync(path.join(__dirname,'../js/play-matrix-rules.js'),'utf8');\n"
          if 'const playMatrixRules=' not in test:
              test = test.replace(needle, addition, 1)
          test = test.replace(
              "['dynamic play matrix',html.includes('function houseMatrixLegal(rowRank, colRank)')&&html.includes('PLAY_MATRIX_RANKS.map((col) => houseMatrixLegal(row, col)')],",
              "['dynamic play matrix',playMatrixRules.includes('function houseMatrixLegal(rowRank, colRank)')&&html.includes('PLAY_MATRIX_RANKS.map((col) => houseMatrixLegal(row, col)')],"
          )
          test_path.write_text(test)
          PY
          node --check js/play-matrix-rules.js
          node tools/house-rules-integration-test.js
          after=$(wc -l < index.html)
          echo "INDEX_LINES_AFTER=$after"
          echo "INDEX_LINES_REMOVED=$((before-after))"
          rm .github/workflows/one-time-refactor-play-matrix-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/play-matrix-rules.js tools/house-rules-integration-test.js .github/workflows/one-time-refactor-play-matrix-rules.yml
          git commit -m "Extract Play Matrix House Rules helper"
          git push origin HEAD:refactor-play-matrix-rules
