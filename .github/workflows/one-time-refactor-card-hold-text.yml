name: One-time Card Hold Text refactor

on:
  push:
    branches:
      - refactor-card-hold-text-data

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-card-hold-text-data
          fetch-depth: 0
      - name: Extract CARD_HOLD_TEXT data
        shell: bash
        run: |
          set -euo pipefail
          before=$(wc -l < index.html)
          echo "INDEX_LINES_BEFORE=$before"
          python3 <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text()
          marker = '    const CARD_HOLD_TEXT = {'
          start = html.index(marker)

          i = start
          brace = 0
          seen_open = False
          end = None
          in_single = in_double = in_template = False
          escaped = False
          while i < len(html):
              ch = html[i]
              if escaped:
                  escaped = False
              elif ch == '\\':
                  escaped = True
              elif not in_double and not in_template and ch == "'":
                  in_single = not in_single
              elif not in_single and not in_template and ch == '"':
                  in_double = not in_double
              elif not in_single and not in_double and ch == '`':
                  in_template = not in_template
              elif not in_single and not in_double and not in_template:
                  if ch == '{':
                      brace += 1
                      seen_open = True
                  elif ch == '}':
                      brace -= 1
                      if seen_open and brace == 0:
                          j = i + 1
                          while j < len(html) and html[j] in ' ;':
                              j += 1
                          while j < len(html) and html[j] in '\r\n':
                              j += 1
                          end = j
                          break
              i += 1
          if end is None:
              raise RuntimeError('Could not find end of CARD_HOLD_TEXT')

          block = html[start:end]
          extracted = '\n'.join(line[4:] if line.startswith('    ') else line for line in block.splitlines()).rstrip() + '\n'
          data_path = Path('js/card-reference-data.js')
          data_path.write_text(data_path.read_text().rstrip() + '\n\n' + extracted)
          index_path.write_text(html[:start] + html[end:])
          PY
          node --check js/card-reference-data.js
          node --check js/card-reference-ui.js
          node tools/house-rules-integration-test.js
          after=$(wc -l < index.html)
          echo "INDEX_LINES_AFTER=$after"
          echo "INDEX_LINES_REMOVED=$((before-after))"
          rm .github/workflows/one-time-refactor-card-hold-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/card-reference-data.js .github/workflows/one-time-refactor-card-hold-text.yml
          git commit -m "Extract card hold reference text data"
          git push origin HEAD:refactor-card-hold-text-data
