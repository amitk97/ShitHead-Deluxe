name: Asset readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/asset-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Export deployment public key
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHITHEAD_PRO }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto');
          const credential = JSON.parse(process.env.DEPLOY_CREDENTIAL);
          console.log(crypto.createPublicKey(credential.private_key).export({type:'spki',format:'pem'}));
          JS
