name: One-time Play Matrix refactor

on:
  push:
    branches:
      - refactor-play-matrix-data

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-play-matrix-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact refactor
        run: node tools/one-time-refactor-play-matrix.js
      - name: Remove one-time helpers
        run: |
          rm tools/one-time-refactor-play-matrix.js
          rm .github/workflows/one-time-refactor-play-matrix.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/play-matrix-data.js tools/one-time-refactor-play-matrix.js .github/workflows/one-time-refactor-play-matrix.yml
          git commit -m "Extract Play Matrix static data"
          git push origin HEAD:refactor-play-matrix-data
