name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  deploy_live_website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHITHEAD_PRO }}

      - name: Deploy Realtime Database rules
        run: npx --yes firebase-tools@latest deploy --only database --project shithead-pro --non-interactive

      - name: Deploy main branch to live Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHITHEAD_PRO }}
          channelId: live
          projectId: shithead-pro
