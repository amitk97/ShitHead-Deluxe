name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  deploy_live_website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy main branch to live Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHITHEAD_PRO }}
          channelId: live
          projectId: shithead-pro

      - name: Verify both live addresses serve this release
        shell: bash
        run: |
          for site in shithead-deluxe shithead-pro; do
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 60 "https://${site}.web.app/?deploy=${GITHUB_SHA}" --output "$RUNNER_TEMP/${site}.html"
            cmp index.html "$RUNNER_TEMP/${site}.html"
            echo "Verified https://${site}.web.app/ serves the deployed game"
          done
