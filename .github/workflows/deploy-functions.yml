# Deploys the push-notification Cloud Functions in functions/.
# Runs automatically when functions/ changes on main, or by hand from
# GitHub → Actions → "Deploy notification functions" → Run workflow. Needs the Firebase project on the Blaze plan and the
# FIREBASE_SERVICE_ACCOUNT_SHITHEAD_PRO service account allowed to deploy
# functions (see CLAUDE.md → Push notifications).
name: Deploy notification functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

permissions:
  contents: read

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHITHEAD_PRO }}

      # The Firebase CLI checks the Blaze plan through this API but never
      # switches it on itself.
      - name: Enable the Cloud Billing API
        run: gcloud services enable cloudbilling.googleapis.com --project shithead-pro

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Deploy functions
        run: |
          npx --yes firebase-tools@13 deploy --only functions --project shithead-pro --non-interactive --force
