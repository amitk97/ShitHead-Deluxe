name: One-time Card Hold system refactor

on:
  push:
    branches:
      - refactor-card-hold-system

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-card-hold-system
          fetch-depth: 0
      - name: Inspect exact Card Hold block
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_LINES_BEFORE=$(wc -l < index.html)"
          sed -n '15365,15530p' index.html
