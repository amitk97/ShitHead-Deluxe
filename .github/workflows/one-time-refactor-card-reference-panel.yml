name: One-time Card Reference panel refactor

on:
  push:
    branches:
      - refactor-card-reference-panel

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-card-reference-panel
          fetch-depth: 0
      - name: Locate Card Reference zoom boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_LINES_BEFORE=$(wc -l < index.html)"
          for needle in "cardRefZoom =" "function loadCardRefZoom" "function saveCardRefZoom" "function applyCardRefZoom" "function setCardRefZoom" "function setCardRefZoomFromCorner" "function getReferenceAvailableRanks" "function initCardRefZoomControls" "let matrixRefOpen"; do
            echo "--- $needle ---"
            grep -n "$needle" index.html | head -5 || true
          done
          sed -n '13360,13765p' index.html
